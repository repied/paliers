<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bühlmann Gradient Factors visualizer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="module" src="js/gf.js"></script>
    <script type="module" src="js/translations.js"></script>
    <script type="module" src="js/script.js" defer></script>
    <script type="module" src="js/plan_analysis.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

    <div class="left_container">
        <div id="lang-theme-selector-container">
            <div id="lang-theme-buttons">
                <button id="theme-toggle-btn" title="Toggle dark mode">🌙</button>
                <button class="lang-btn" data-lang="fr" title="Français">🇫🇷</button>
                <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
            </div>
        </div>
        <h1 id="main-title"></h1>
        <p id="intro"></p>
        <a id="readme-link" href="./docs/gf_fr.md" data-href-fr="./docs/gf_fr.html"
            data-href-en="./docs/gf_en.html"></a>
        &nbsp;&nbsp;&nbsp;
        <a id="source-link" href="https://github.com/repied/paliers">Source Code</a>

        </p>

        <div class="input-grid">
            <div class="input-group">
                <label for="maxDepth" id="label-maxDepth"></label>
                <input type="number" id="maxDepth" value="30" min="0" max="300" step="1">
                <input type="range" id="maxDepthSlider" min="0" max="300" value="30" step="1">

                <label for="bottomTime" id="label-bottomTime"></label>
                <input type="number" id="bottomTime" value="20" min="0" max="600" step="1">
                <input type="range" id="bottomTimeSlider" min="0" max="600" value="20" step="1">
            </div>
            <div class="input-group">
                <label for="ascent_rate" id="label-ascent_rate"></label>
                <input type="number" id="ascent_rate" value="10" min="0" max="100" step="1">

                <label for="descent_rate" id="label-descent_rate"></label>
                <input type="number" id="descent_rate" value="20" min="0" max="100" step="1">

                <label for="surface_pressure" id="label-surface_pressure"></label>
                <input type="number" id="surface_pressure" value="1.0" min="0" max="2.0" step="0.1">
            </div>
            <div class="input-group">
                <label for="stop_interval" id="label-stop_interval"></label>
                <input type="number" id="stop_interval" value="3" min="0" max="10" step="0.5">

                <label for="last_stop_depth" id="label-last_stop_depth"></label>
                <input type="number" id="last_stop_depth" value="3" min="0" max="10" step="0.5">

                <label for="time_step" id="label-time_step"></label>
                <input type="number" id="time_step" value="1" min="0.1" max="5" step="0.25">
            </div>
        </div>

        <h2 id="canvas-title"></h2>
        <div class="column_container">
            <canvas title="deco-canvas" id="decoCanvas" width="600" height="600"></canvas>
            <div id="plan-as-string" style="width: 30%;"></div>
        </div>
    </div>

    <div id="right-container">
        <h2 id="right-container-h2"></h2>
        <div id="plotly-plot"></div>
    </div>


</body>

</html>
