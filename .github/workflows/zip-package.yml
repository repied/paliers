name: Create Zip Package

on:
  push:
    branches: ["main"]

jobs:
  zip_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create dist directory
        run: mkdir -p dist

      - name: Create zip package
        run: zip -r dist/paliers.zip index.html style.css js docs

      - name: Commit and push zip file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Update zip package [skip ci]"
          file_pattern: dist/paliers.zip
